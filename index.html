<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS OMS // Hệ Thống Kiểm Soát Hạn Mức Công Nợ & Chặn Đơn Quá Hạn (SCRUM-9)</title>
  <meta name="description" content="Hệ thống B2B Enterprise Order Management & Credit Risk Gatekeeper - Kiểm soát hạn mức công nợ đại lý, đánh dấu cần duyệt khi vượt hạn mức, chặn tạo đơn hoàn toàn khi có nợ quá hạn." />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/order-form.css" />
  <link rel="stylesheet" href="css/credit-gatekeeper.css" />
</head>
<body>

  <!-- ===================================================================
       APPLICATION HEADER (DOANH NGHIỆP TOÀN CẦU)
       =================================================================== -->
  <header class="app-header">
    <div class="brand-section">
      <div class="brand-logo-wrap">
        <i class="ph-fill ph-shield-check" style="font-size: 24px;"></i>
      </div>
      <div class="brand-info">
        <div class="brand-title">
          <span>NEXUS OMS</span>
          <span class="brand-badge">B2B SALES PLATFORM</span>
          <span class="ticket-tag">SCRUM-86 / SCRUM-9</span>
        </div>
        <span class="brand-desc">Phân Hệ Thẩm Định Tín Dụng & Cổng Chặn Rủi Ro Công Nợ Đại Lý (Credit Risk Gatekeeper)</span>
      </div>
    </div>

    <!-- MAIN NAVIGATION TABS -->
    <nav class="app-nav-tabs">
      <button class="nav-tab-btn active" data-tab="order-screen">
        <i class="ph-bold ph-file-plus"></i>
        <span>Tạo Đơn Hàng</span>
      </button>

      <button class="nav-tab-btn" data-tab="approval-screen">
        <i class="ph-bold ph-shield-check"></i>
        <span>Đơn Hàng & Phê Duyệt</span>
        <span class="badge-counter" id="pendingApprovalBadge">1</span>
      </button>

      <button class="nav-tab-btn" data-tab="matrix-screen">
        <i class="ph-bold ph-chart-polar"></i>
        <span>Giám Sát Công Nợ & Aging</span>
      </button>
    </nav>
  </header>

  <!-- ===================================================================
       SCENARIO QUICK SWITCHER BAR (DÀNH RIÊNG CHO GIẢNG VIÊN KIỂM THỬ 1-CLICK)
       =================================================================== -->
  <div class="scenario-quick-bar">
    <div class="scenario-label">
      <i class="ph-fill ph-lightning"></i>
      <span>KỊCH BẢN KIỂM THỬ NHANH DÀNH CHO GIẢNG VIÊN (1-CLICK TEST):</span>
    </div>

    <div class="scenario-pills-row">
      <!-- Kịch bản 1: An Toàn -->
      <button class="preset-btn active" data-scenario="NORMAL_SAFE" title="Công nợ 140M / 600M, còn 460M, nợ 5 ngày < 30 ngày -> Tạo đơn bình thường, duyệt ngay">
        🟢 Kịch bản 1: An Toàn (ĐL Ánh Dương)
      </button>

      <!-- Kịch bản 2: Vượt Hạn Mức -->
      <button class="preset-btn" data-scenario="OVER_LIMIT" title="Công nợ 350M / 400M, còn 50M. Đơn > 50M -> Hệ thống tự động chuyển trạng thái CẦN DUYỆT">
        🟡 Kịch bản 2: Vượt Hạn Mức -> Cần Duyệt (ĐL Sao Mai)
      </button>

      <!-- Kịch bản 3: Nợ Quá Hạn Vi Phạm -->
      <button class="preset-btn" data-scenario="OVERDUE_BLOCKED" title="Có 2 hóa đơn quá hạn 56 ngày & 45 ngày (> 30 ngày quy định) -> CHẶN TẠO ĐƠN HOÀN TOÀN">
        🔴 Kịch bản 3: Nợ Quá Hạn Vi Phạm -> KHÓA CỨNG (ĐL Thăng Long)
      </button>

      <!-- Kịch bản 4: Cận Hạn Mức Biên -->
      <button class="preset-btn" data-scenario="BORDERLINE" title="Công nợ 494M / 500M (98.8%), chỉ còn 6M khả dụng -> Test sự nhạy bén của thanh đo">
        🟣 Kịch bản 4: Cận Hạn Mức Biên 98.8% (ĐL Sài Gòn Star)
      </button>

      <!-- Kịch bản 5: Đại Lý Mới -->
      <button class="preset-btn" data-scenario="CLEAN_NEW" title="Đại lý mới 100% không có nợ, hạn mức 300M dồi dào">
        ⚪ Kịch bản 5: Không Công Nợ (ĐL Mekong)
      </button>
    </div>
  </div>

  <!-- ===================================================================
       APP MAIN CONTENT (CONTAINERS CHO 3 TABS)
       =================================================================== -->
  <main class="app-main-content">
    
    <!-- TAB 1: MÀN HÌNH TẠO ĐƠN HÀNG (TRỌNG TÂM ĐỀ BÀI) -->
    <div id="orderScreenContainer" class="tab-view-container active"></div>

    <!-- TAB 2: DANH SÁCH ĐƠN & PHÊ DUYỆT CÔNG NỢ (TIÊU CHÍ 2 DUYỆT NGOẠI LỆ) -->
    <div id="approvalScreenContainer" class="tab-view-container"></div>

    <!-- TAB 3: MA TRẬN CÔNG NỢ ĐẠI LÝ & BÁO CÁO AGING DEBT (TIÊU CHÍ 3 KIỂM SOÁT QUÁ HẠN) -->
    <div id="matrixScreenContainer" class="tab-view-container"></div>

  </main>

  <!-- ===================================================================
       GLOBAL MODAL DIALOG CONTAINER
       =================================================================== -->
  <div id="globalModalOverlay" class="modal-overlay">
    <div id="globalModalContainer" class="modal-dialog-box"></div>
  </div>

  <!-- ===================================================================
       TOAST NOTIFICATIONS CONTAINER
       =================================================================== -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Main ES6 Application Entrypoint -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
