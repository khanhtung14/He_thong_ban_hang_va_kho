openapi: 3.0.3
info:
  title: API He Thong Ban Hang
  version: 1.0.0
paths:
  /api/v1/deliveries/trips:
    post:
      summary: Tạo chuyến giao hàng (SCRUM-52)
      description: Gán các phiếu xuất SHIPPED chưa thuộc chuyến khác và khai báo thời gian dự kiến hoàn tất.
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryTripRequest'
      responses:
        '201':
          description: Chuyến giao đã được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryTripResponse'
        '401':
          description: Chưa xác thực
        '403':
          description: Không đủ quyền
        '422':
          description: Request không hợp lệ
        '409':
          description: Phiếu xuất không còn ở trạng thái giao hoặc đã thuộc chuyến khác
  /api/v1/deliveries/trips/active:
    get:
      summary: Theo dõi chuyến giao đang chạy (SCRUM-52)
      description: Danh sách chuyến còn phiếu SHIPPED chưa xác nhận; hàng chưa giao vẫn thuộc chuyến. Giá trị trên đường tạm tính bằng Order.total_amount của mỗi đơn có phiếu chưa giao, mỗi đơn tính một lần.
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Các chuyến đang chạy, số điểm giao và giá trị hàng trên đường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryTripListResponse'
        '401':
          description: Chưa xác thực
        '403':
          description: Không đủ quyền
  /api/v1/deliveries/pending-confirmations:
    get:
      summary: Danh sách phiếu xuất chờ xác nhận giao hàng (SCRUM-51)
      description: Trả các phiếu SHIPPED chưa có kết quả giao hàng, mới nhất trước.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Danh sách phiếu xuất đang chờ xác nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingDispatchesResponse'
        '401':
          description: Chưa xác thực
        '403':
          description: Không đủ quyền
        '422':
          description: Tham số limit không hợp lệ
  /api/v1/deliveries/{dispatch_id}/confirm-pod:
    post:
      summary: Xác nhận kết quả giao hàng (SCRUM-51)
      description: Giao thành công lưu ảnh chứng từ; giao thất bại nhập toàn bộ hàng trong phiếu về kho được chọn. Chỉ dispatch giao thành công đủ điều kiện phát hành hóa đơn.
      parameters:
        - name: dispatch_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeliveryConfirmationForm'
      responses:
        '200':
          description: Kết quả giao hàng đã được ghi nhận
        '401':
          description: Chưa xác thực
        '403':
          description: Không đủ quyền hoặc ngoài phạm vi kho
        '409':
          description: Phiếu xuất không thể xác nhận ở trạng thái hiện tại
        '422':
          description: Dữ liệu xác nhận không hợp lệ
    get:
      summary: Tra cứu kết quả xác nhận giao hàng (SCRUM-51)
      description: Trả thông tin giao nhận và URL ảnh chứng từ đã lưu cho dispatch.
      parameters:
        - name: dispatch_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Kết quả giao hàng đã lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryConfirmationRecordResponse'
        '401':
          description: Chưa xác thực
        '403':
          description: Không đủ quyền
        '404':
          description: Chưa có kết quả giao hàng
  /api/v1/deliveries/proofs/{filename}:
    get:
      summary: Tải ảnh chứng từ giao hàng (SCRUM-51)
      description: Trả ảnh JPEG được lưu khi xác nhận giao hàng thành công.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ảnh chứng từ giao hàng
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          description: Chưa xác thực
        '403':
          description: Không đủ quyền
        '404':
          description: Không tìm thấy ảnh chứng từ
  /products:
    get:
      summary: Danh sách sản phẩm
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
  schemas:
    CreateDeliveryTripRequest:
      type: object
      required: [driverName, vehicleNumber, dispatchIds, expectedCompletionAt]
      properties:
        driverName:
          type: string
          minLength: 1
          maxLength: 150
        vehicleNumber:
          type: string
          minLength: 1
          maxLength: 50
        dispatchIds:
          type: array
          minItems: 1
          items:
            type: integer
        routeName:
          type: string
          nullable: true
          maxLength: 150
        expectedCompletionAt:
          type: string
          format: date-time
          description: Bắt buộc; được chuẩn hóa về UTC.
    DeliveryTripResponse:
      type: object
      required: [success, code, data]
      properties:
        success:
          type: boolean
        code:
          type: integer
        data:
          $ref: '#/components/schemas/ActiveDeliveryTrip'
    DeliveryTripListResponse:
      type: object
      required: [success, code, data]
      properties:
        success:
          type: boolean
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActiveDeliveryTrip'
    ActiveDeliveryTrip:
      type: object
      required: [tripId, driverName, vehicleNumber, expectedCompletionAt, isOverdue, deliveredStops, remainingStops, onRoadAmount, dispatches]
      properties:
        tripId:
          type: integer
        driverName:
          type: string
        vehicleNumber:
          type: string
        routeName:
          type: string
          nullable: true
        expectedCompletionAt:
          type: string
          format: date-time
          nullable: true
          description: Có thể null với chuyến cũ được tạo trước khi có lịch dự kiến.
        isOverdue:
          type: boolean
        deliveredStops:
          type: integer
        remainingStops:
          type: integer
        onRoadAmount:
          type: number
        dispatches:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryTripDispatch'
    DeliveryTripDispatch:
      type: object
      required: [dispatchId, orderId, status, customerName]
      properties:
        dispatchId:
          type: integer
        orderId:
          type: integer
        status:
          type: string
        customerName:
          type: string
        desiredDeliveryDate:
          type: string
          format: date
          nullable: true
    PendingDispatchesResponse:
      type: object
      required: [success, code, data]
      properties:
        success:
          type: boolean
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/PendingDispatch'
    PendingDispatch:
      type: object
      required: [dispatchId, orderId]
      properties:
        dispatchId:
          type: integer
        orderId:
          type: integer
    DeliveryConfirmationForm:
      type: object
      required:
        - deliveryStatus
      properties:
        deliveryStatus:
          type: string
          enum: [DELIVERED, FAILED]
          default: DELIVERED
        receiverName:
          type: string
          maxLength: 150
          description: Bắt buộc khi giao thành công.
        receivedDate:
          type: string
          format: date-time
          description: Bắt buộc khi giao thành công.
        note:
          type: string
          maxLength: 2000
        proofImages:
          type: array
          maxItems: 5
          items:
            type: string
            format: binary
          description: Ảnh JPG/PNG tối đa 5 MB mỗi ảnh; bắt buộc khi giao thành công.
        failureReason:
          type: string
          enum: [CUSTOMER_CLOSED, CUSTOMER_REFUSED, NO_CONTACT, ADDRESS_NOT_FOUND, OTHER]
          description: Bắt buộc khi deliveryStatus là FAILED.
        returnWarehouseId:
          type: integer
          minimum: 1
          description: Bắt buộc khi deliveryStatus là FAILED.
    DeliveryConfirmationRecordResponse:
      type: object
      required: [success, code, data]
      properties:
        success:
          type: boolean
        code:
          type: integer
        data:
          $ref: '#/components/schemas/DeliveryConfirmationRecord'
    DeliveryConfirmationRecord:
      type: object
      required: [dispatchId, orderId, deliveryStatus, proofImages]
      properties:
        dispatchId:
          type: integer
        orderId:
          type: integer
        deliveryStatus:
          type: string
          enum: [DELIVERED, FAILED]
        receiverName:
          type: string
          nullable: true
        receivedDate:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
        proofImages:
          type: array
          items:
            type: string
            format: uri-reference
        returnWarehouseId:
          type: integer
          nullable: true
    Product:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
