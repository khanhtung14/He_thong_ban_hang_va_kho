<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu mới - Hệ thống Bán hàng và Kho (SCRUM-57)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: var(--gray-800);
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .badge-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .ticket-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #e0e7ff;
      color: #3730a3;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
    }

    .card {
      background: #ffffff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 32px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .icon-wrapper {
      width: 56px;
      height: 56px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .icon-wrapper svg {
      width: 28px;
      height: 28px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--gray-600);
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 8px;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--gray-300);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .checklist {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .checklist-title {
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 8px;
    }

    .rule-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      color: var(--gray-600);
    }

    .rule-item.valid {
      color: var(--success);
      font-weight: 500;
    }

    .rule-item.invalid {
      color: var(--gray-600);
    }

    button.btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-primary:hover {
      background: var(--primary-hover);
    }

    button.btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .alert {
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
      display: none;
    }

    .alert-success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success);
    }

    .alert-error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error);
    }

    .btn-secondary {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 12px;
      background: var(--gray-100);
      color: var(--gray-700);
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      margin-top: 12px;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: var(--gray-200);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge-bar">
      <div class="ticket-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
        </svg>
        SCRUM-6 / SCRUM-57
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <h1>Thiết lập mật khẩu mới</h1>
        <p class="subtitle" id="subtitleText">
          Đang xác thực liên kết đặt lại mật khẩu...
        </p>
      </div>

      <div id="alertBox" class="alert"></div>

      <div id="invalidTokenSection" style="display: none; text-align: center;">
        <a href="/forgot-password" class="btn-primary" style="display: inline-block; text-decoration: none; margin-top: 8px;">
          Yêu cầu liên kết mới
        </a>
      </div>

      <form id="resetForm" style="display: none;">
        <div class="form-group">
          <label for="newPassword">Mật khẩu mới:</label>
          <input
            type="password"
            id="newPassword"
            placeholder="Nhập ít nhất 8 ký tự, có chữ và số"
            required
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Nhập lại mật khẩu mới"
            required
            autocomplete="new-password"
          >
        </div>

        <div class="checklist">
          <div class="checklist-title">Yêu cầu bảo mật mật khẩu:</div>
          <div class="rule-item" id="ruleLength">⚪ Tối thiểu 8 ký tự</div>
          <div class="rule-item" id="ruleLetter">⚪ Chứa ít nhất một chữ cái</div>
          <div class="rule-item" id="ruleDigit">⚪ Chứa ít nhất một chữ số</div>
          <div class="rule-item" id="ruleMatch">⚪ Mật khẩu xác nhận trùng khớp</div>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">
          Cập nhật mật khẩu mới
        </button>
      </form>

      <div id="successActions" style="display: none;">
        <a href="/forgot-password" class="btn-secondary">
          Quay lại trang Quên mật khẩu
        </a>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const alertBox = document.getElementById('alertBox');
    const resetForm = document.getElementById('resetForm');
    const invalidTokenSection = document.getElementById('invalidTokenSection');
    const subtitleText = document.getElementById('subtitleText');
    const submitBtn = document.getElementById('submitBtn');
    const successActions = document.getElementById('successActions');

    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');

    // Rule elements
    const ruleLength = document.getElementById('ruleLength');
    const ruleLetter = document.getElementById('ruleLetter');
    const ruleDigit = document.getElementById('ruleDigit');
    const ruleMatch = document.getElementById('ruleMatch');

    function checkRules() {
      const p1 = newPasswordInput.value;
      const p2 = confirmPasswordInput.value;

      const hasLen = p1.length >= 8;
      const hasLet = /[a-zA-Z]/.test(p1);
      const hasDig = /[0-9]/.test(p1);
      const isMatch = p1.length > 0 && p1 === p2;

      setRule(ruleLength, hasLen, 'Tối thiểu 8 ký tự');
      setRule(ruleLetter, hasLet, 'Chứa ít nhất một chữ cái');
      setRule(ruleDigit, hasDig, 'Chứa ít nhất một chữ số');
      setRule(ruleMatch, isMatch, 'Mật khẩu xác nhận trùng khớp');

      return hasLen && hasLet && hasDig && isMatch;
    }

    function setRule(el, valid, text) {
      if (valid) {
        el.className = 'rule-item valid';
        el.innerHTML = `🟢 ${text}`;
      } else {
        el.className = 'rule-item invalid';
        el.innerHTML = `⚪ ${text}`;
      }
    }

    newPasswordInput.addEventListener('input', checkRules);
    confirmPasswordInput.addEventListener('input', checkRules);

    async function init() {
      if (!token) {
        showAlert('error', 'Không tìm thấy mã liên kết (token). Vui lòng kiểm tra lại email hoặc gửi lại yêu cầu.');
        subtitleText.innerText = 'Liên kết không hợp lệ';
        invalidTokenSection.style.display = 'block';
        return;
      }

      try {
        const res = await fetch(`/verify-reset-token/${encodeURIComponent(token)}`);
        const data = await res.json();

        if (!res.ok) {
          showAlert('error', data.detail || 'Liên kết không hợp lệ hoặc đã hết hạn.');
          subtitleText.innerText = 'Liên kết đã hết hiệu lực';
          invalidTokenSection.style.display = 'block';
          return;
        }

        subtitleText.innerText = `Đang đặt lại mật khẩu cho tài khoản: ${data.email}`;
        resetForm.style.display = 'block';
      } catch (err) {
        showAlert('error', 'Lỗi kết nối máy chủ. Vui lòng thử lại sau.');
        invalidTokenSection.style.display = 'block';
      }
    }

    function showAlert(type, msg) {
      alertBox.className = `alert alert-${type}`;
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const new_password = newPasswordInput.value;
      const confirm_password = confirmPasswordInput.value;

      if (!checkRules()) {
        showAlert('error', 'Vui lòng đáp ứng đầy đủ tất cả các yêu cầu mật khẩu bên dưới.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Đang cập nhật...';

      try {
        const res = await fetch('/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            new_password,
            confirm_password
          })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert('error', data.detail || 'Không thể đặt lại mật khẩu.');
          submitBtn.disabled = false;
          submitBtn.innerText = 'Cập nhật mật khẩu mới';
          return;
        }

        showAlert('success', data.message);
        resetForm.style.display = 'none';
        subtitleText.innerText = 'Đặt lại mật khẩu thành công!';
        successActions.style.display = 'block';
      } catch (err) {
        showAlert('error', 'Lỗi kết nối máy chủ khi gửi mật khẩu mới.');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Cập nhật mật khẩu mới';
      }
    });

    init();
  </script>
</body>
</html>
